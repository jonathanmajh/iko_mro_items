name: Build
on: [pull_request]

jobs:
  build_on_win:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-node@master
      with:
        node-version: 22
    - name: install dependencies
      run: npm install
    - name: lint
      run: npm run lint
    - name: test
      run: npm run test
    - name: build
      run: npm run make